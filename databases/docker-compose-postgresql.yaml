postgresql-db:
  image: postgres:15
  container_name: postgresql-webinitializr
  restart: always
  environment:
    POSTGRES_USER: ${DATABASE_USER}
    POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    POSTGRES_DB: ${DATABASE_DB}
  volumes:
    - ${DATABASE_VOLUME}:/var/lib/postgresql/data
  networks:
    - backend
  ports: # Remove if you don't want to expose anything
    - "127.0.0.1:5432:5432" # This won't allow public acces